<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1050" viewBox="0 0 1800 1050">
  <rect width="1800" height="1050" fill="#ffffff"/>
  <defs>
    <style>
      text { font-family: Inter, Arial, sans-serif; }
      .title { font-size: 30px; font-weight: 700; text-anchor: middle; }
      .box-text { font-size: 24px; font-weight: 700; fill: #14532D; text-anchor: middle; }
      .small { font-size: 18px; font-weight: 400; fill: #374151; text-anchor: middle; }
      .dep { font-size: 16px; font-weight: 400; fill: #4B5563; text-anchor: middle; }
      .solid { fill: none; stroke: #111827; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .dashed { fill: none; stroke: #6B7280; stroke-width: 2.2; stroke-dasharray: 7 6; stroke-linecap: round; stroke-linejoin: round; }
      .label-left { text-anchor: start; }
    </style>
  </defs>

  <!-- Actors -->
  <g stroke="#111827" stroke-width="3" fill="none">
    <circle cx="70" cy="235" r="23"/>
    <path d="M70 258 L70 318 M38 292 L102 292 M70 318 L42 355 M70 318 L98 355"/>
    <circle cx="70" cy="415" r="23"/>
    <path d="M70 438 L70 498 M38 472 L102 472 M70 498 L42 535 M70 498 L98 535"/>
  </g>
  <text x="70" y="385" class="small">Giáo viên</text>
  <text x="70" y="565" class="small">Quản trị viên</text>

  <!-- Frontend -->
  <rect x="130" y="165" width="310" height="520" rx="12" fill="#F4F8FF" stroke="#2563EB" stroke-width="2"/>
  <text x="285" y="220" class="title" fill="#1E3A8A">Giao diện web</text>
  <rect x="180" y="285" width="210" height="140" rx="10" fill="#ffffff" stroke="#2563EB" stroke-width="2"/>
  <text x="285" y="345" class="box-text" fill="#111827">Màn hình</text>
  <text x="285" y="378" class="box-text" fill="#111827">quản lý</text>
  <rect x="180" y="505" width="210" height="110" rx="10" fill="#ffffff" stroke="#2563EB" stroke-width="2"/>
  <text x="285" y="570" class="box-text" fill="#111827">API client</text>
  <polyline points="105,260 180,260" class="solid"/>
  <polygon points="180,260 168,253 168,267" fill="#111827"/>
  <polyline points="105,440 180,440" class="solid"/>
  <polygon points="180,440 168,433 168,447" fill="#111827"/>
  <polyline points="285,425 285,505" class="solid"/>
  <polygon points="285,505 278,493 292,493" fill="#111827"/>

  <!-- Backend -->
  <rect x="500" y="80" width="850" height="820" rx="14" fill="#F4FBF4" stroke="#2E7D32" stroke-width="2"/>
  <text x="925" y="132" class="title" fill="#14532D">Backend TMS</text>
  <rect x="575" y="185" width="150" height="95" rx="10" fill="#ffffff" stroke="#2E7D32" stroke-width="2"/>
  <text x="650" y="240" class="box-text">Route</text>
  <rect x="820" y="185" width="150" height="95" rx="10" fill="#ffffff" stroke="#2E7D32" stroke-width="2"/>
  <text x="895" y="240" class="box-text">Security</text>
  <rect x="1065" y="185" width="150" height="95" rx="10" fill="#ffffff" stroke="#2E7D32" stroke-width="2"/>
  <text x="1140" y="240" class="box-text">Controller</text>
  <polyline points="390,560 465,560 465,232 575,232" class="solid"/>
  <polygon points="575,232 563,225 563,239" fill="#111827"/>
  <text x="452" y="536" class="small">HTTP</text>
  <text x="452" y="558" class="small">request</text>
  <polyline points="725,232 820,232" class="solid"/>
  <polygon points="820,232 808,225 808,239" fill="#111827"/>
  <polyline points="970,232 1065,232" class="solid"/>
  <polygon points="1065,232 1053,225 1053,239" fill="#111827"/>

  <!-- Modules -->
  <rect x="560" y="385" width="730" height="440" rx="12" fill="#F8FFF8" stroke="#6AA86F" stroke-width="2"/>
  <text x="925" y="438" class="title" fill="#14532D">Module nghiệp vụ</text>
  <polyline points="1140,280 1140,385" class="solid"/>
  <polygon points="1140,385 1133,373 1147,373" fill="#111827"/>
  <text x="1196" y="342" class="small">gọi use case</text>
  <rect x="615" y="500" width="130" height="90" rx="9" fill="#ffffff" stroke="#2E7D32" stroke-width="2"/>
  <text x="680" y="552" class="box-text">Account</text>
  <rect x="790" y="500" width="130" height="90" rx="9" fill="#ffffff" stroke="#2E7D32" stroke-width="2"/>
  <text x="855" y="552" class="box-text">Student</text>
  <rect x="965" y="500" width="130" height="90" rx="9" fill="#ffffff" stroke="#2E7D32" stroke-width="2"/>
  <text x="1030" y="552" class="box-text">Classroom</text>
  <rect x="790" y="660" width="130" height="90" rx="9" fill="#ffffff" stroke="#2E7D32" stroke-width="2"/>
  <text x="855" y="712" class="box-text">Finance</text>
  <rect x="1080" y="660" width="130" height="90" rx="9" fill="#ffffff" stroke="#2E7D32" stroke-width="2"/>
  <text x="1145" y="712" class="box-text">System</text>

  <!-- Module dependencies -->
  <polyline points="790,535 745,535" class="dashed"/>
  <polygon points="745,535 757,528 757,542" fill="#6B7280"/>
  <polyline points="920,535 965,535" class="dashed"/>
  <polygon points="965,535 953,528 953,542" fill="#6B7280"/>
  <polyline points="855,590 855,660" class="dashed"/>
  <polygon points="855,660 848,648 862,648" fill="#6B7280"/>
  <polyline points="820,660 820,590" class="dashed"/>
  <polygon points="820,590 813,602 827,602" fill="#6B7280"/>
  <polyline points="965,565 920,565" class="dashed"/>
  <polygon points="920,565 932,558 932,572" fill="#6B7280"/>
  <polyline points="1010,590 900,660" class="dashed"/>
  <polygon points="900,660 906,647 914,659" fill="#6B7280"/>
  <polyline points="1080,705 955,705 955,590" class="dashed"/>
  <polygon points="955,590 948,602 962,602" fill="#6B7280"/>
  <polyline points="965,518 745,518" class="dashed"/>
  <polygon points="745,518 757,511 757,525" fill="#6B7280"/>
  <rect x="600" y="750" width="650" height="62" rx="8" fill="#ffffff" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="925" y="778" class="dep">Nét đứt: Student→Account/Classroom/Finance; Classroom→Student/Finance/Account;</text>
  <text x="925" y="800" class="dep">Finance→Student; System→Account.</text>

  <!-- Data and external systems -->
  <rect x="1420" y="165" width="290" height="660" rx="12" fill="#FFF8EA" stroke="#D97706" stroke-width="2"/>
  <text x="1565" y="215" class="title" fill="#92400E">Dữ liệu &amp;</text>
  <text x="1565" y="250" class="title" fill="#92400E">Hệ thống ngoài</text>
  <text x="1565" y="322" class="box-text" fill="#92400E">Dữ liệu</text>
  <rect x="1470" y="350" width="190" height="130" rx="10" fill="#ffffff" stroke="#D97706" stroke-width="2"/>
  <text x="1565" y="398" class="box-text" fill="#111827">Azure</text>
  <text x="1565" y="428" class="box-text" fill="#111827">Database</text>
  <text x="1565" y="458" class="box-text" fill="#111827">Server</text>
  <text x="1565" y="570" class="box-text" fill="#92400E">Hệ thống ngoài</text>
  <rect x="1470" y="610" width="190" height="80" rx="10" fill="#ffffff" stroke="#D97706" stroke-width="2"/>
  <text x="1565" y="660" class="box-text" fill="#111827">Discord</text>
  <rect x="1470" y="720" width="190" height="80" rx="10" fill="#ffffff" stroke="#D97706" stroke-width="2"/>
  <text x="1565" y="770" class="box-text" fill="#111827">Codeforces</text>

  <!-- Connections to data / external systems -->
  <polyline points="1290,605 1365,605 1365,415 1470,415" class="solid"/>
  <polygon points="1470,415 1458,408 1458,422" fill="#111827"/>
  <text x="1360" y="586" class="small">đọc/ghi dữ liệu</text>
  <polyline points="855,590 855,625 1470,625" class="solid"/>
  <polygon points="1470,625 1458,618 1458,632" fill="#111827"/>
  <polyline points="1030,590 1030,650 1470,650" class="solid"/>
  <polygon points="1470,650 1458,643 1458,657" fill="#111827"/>
  <polyline points="1030,590 1030,760 1470,760" class="solid"/>
  <polygon points="1470,760 1458,753 1458,767" fill="#111827"/>

  <!-- Legend -->
  <rect x="70" y="820" width="390" height="140" rx="10" fill="#ffffff" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="105" y="855" class="small label-left" font-weight="700">Chú thích</text>
  <polyline points="100,885 170,885" class="solid"/>
  <polygon points="170,885 158,878 158,892" fill="#111827"/>
  <text x="195" y="892" class="small label-left">Luồng chính / Kết nối</text>
  <polyline points="100,925 170,925" class="dashed"/>
  <polygon points="170,925 158,918 158,932" fill="#6B7280"/>
  <text x="195" y="932" class="small label-left">Quan hệ phụ thuộc module</text>
</svg>
