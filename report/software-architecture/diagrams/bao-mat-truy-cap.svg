    <line x1="740" y1="290" x2="760" y2="290" stroke="#111" stroke-width="2.4" marker-end="url(#arrow)"/>
    <line x1="950" y1="290" x2="970" y2="290" stroke="#111" stroke-width="2.4" marker-end="url(#arrow)"/>
    <line x1="1160" y1="290" x2="1180" y2="290" stroke="#111" stroke-width="2.4" marker-end="url(#arrow)"/>
