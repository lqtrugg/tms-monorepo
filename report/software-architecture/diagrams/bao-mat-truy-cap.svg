    <text x="1070" y="545" font-size="15" font-weight="700" fill="#c0392b" text-anchor="middle">403 Forbidden</text>
    <text x="1070" y="570" font-size="14" fill="#c0392b" text-anchor="middle">Sai vai trò</text>
    <line x1="1065" y1="485" x2="1065" y2="520" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow)"/>

